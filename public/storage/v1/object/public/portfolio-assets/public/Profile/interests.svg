<svg xmlns="http://www.w3.org/2000/svg" width="600" height="840" viewBox="0 0 600 840" role="img"><title>interests</title><rect width="100%" height="100%" fill="#e4e8d8"/><text x="44" y="112" fill="#1c1c1c" font-family="Arial,sans-serif" font-size="62" font-weight="700">BEYOND</text><text x="44" y="183" fill="#1c1c1c" font-family="Arial,sans-serif" font-size="62" font-weight="700">THE CODE</text><text x="44" y="286" fill="#1c1c1c" font-family="Arial,sans-serif" font-size="27" font-weight="500">Curiosity drives the next build.</text><text x="44" y="386" fill="#1c1c1c" font-family="Arial,sans-serif" font-size="27" font-weight="400">Software. Sports. New ideas.</text><text x="44" y="441" fill="#1c1c1c" font-family="Arial,sans-serif" font-size="27" font-weight="400">Learning by making things.</text><text x="44" y="550" fill="#1c1c1c" font-family="Arial,sans-serif" font-size="27" font-weight="400">Open to thoughtful web</text><text x="44" y="594" fill="#1c1c1c" font-family="Arial,sans-serif" font-size="27" font-weight="400">development collaborations.</text><text x="44" y="760" fill="#1c1c1c" font-family="Arial,sans-serif" font-size="25" font-weight="400">Let’s build something useful.</text></svg>